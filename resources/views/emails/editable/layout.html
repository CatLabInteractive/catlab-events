<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ organisation.name }}</title>
<style type="text/css">
body { margin: 0; padding: 0; -webkit-text-size-adjust: 100%; }
.content h2 { font-size: 24px; line-height: 1.25; font-weight: bold; color: #1d2330; margin: 0 0 16px; }
.content h3 { font-size: 17px; line-height: 1.3; font-weight: bold; color: #1d2330; margin: 24px 0 8px; }
.content p { margin: 0 0 14px; }
.content ul { margin: 0 0 14px; padding-left: 20px; }
.content li { margin: 0 0 6px; }
.content a { color: {{ layout.accent_color }}; }
@media only screen and (max-width: 640px) {
    .card { width: 100% !important; }
    .content { border-radius: 0 !important; padding: 28px 20px !important; }
    .outer { padding: 16px 0 !important; }
}
</style>
</head>
<body bgcolor="#eef0f3" style="margin:0;padding:0;background:#eef0f3">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#eef0f3" style="background:#eef0f3">
    <tr>
        <td align="center" class="outer" style="padding:32px 12px">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" class="card" style="width:600px">
                <tr>
                    <td align="center" data-mail-header style="padding:0 0 24px">{{ layout.header }}</td>
                </tr>
                <tr>
                    <td bgcolor="#ffffff" class="content" style="background:#ffffff;border-radius:10px;padding:40px 44px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;color:#3d4451;border-top:4px solid {{ layout.accent_color }}">
{{ content }}
                    </td>
                </tr>
                <tr>
                    <td align="center" style="padding:24px 24px 8px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.6;color:#5d6676">{{ layout.footer }}</td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
