name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    name: Run Tests

    steps:
      - uses: actions/checkout@v4

      - name: Copy environment file
        run: cp .env.example .env

      - name: Build and start containers
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build

      - name: Wait for containers to initialize
        run: |
          sleep 5
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs webserver --tail=50

      - name: Wait for MySQL to be ready
        run: |
          echo "Waiting for MySQL..."
          source .env
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T mysql-db mysql -u "$DB_USERNAME" -p"$DB_PASSWORD" -e "SELECT 1" >/dev/null 2>&1; then
              echo "MySQL is ready!"
              break
            fi
            echo "Attempt $i/30..."
            sleep 2
          done

      - name: Generate application key
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T webserver php artisan key:generate

      - name: Run migrations
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T webserver php artisan migrate --force

      - name: Run tests
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T webserver vendor/bin/phpunit

      - name: Stop containers
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down
