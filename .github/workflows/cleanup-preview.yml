# Removes a pull request's static preview (see preview.yml) from gh-pages
# once the pull request is merged or closed.

name: Clean up preview

on:
  pull_request:
    types: [ closed ]

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: gh-pages
        continue-on-error: true

      - name: Remove pr/${{ github.event.pull_request.number }}
        if: steps.checkout.outcome == 'success'
        run: |
          dir="pr/${{ github.event.pull_request.number }}"
          if [ ! -d "$dir" ]; then echo "No preview to remove"; exit 0; fi
          git rm -rq "$dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Remove preview #${{ github.event.pull_request.number }}"
          git push
